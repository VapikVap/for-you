<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для Насти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f1226; --bg2:#1b1f3f; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.16);
  --text:#f4f1ff; --muted:#c9c4e6; --accent:#ffb84d; --accent2:#7c8cff; --ok:#7dffb0; --bad:#ff8a8a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1100px 700px at 15% 0%,#2b2f6b 0%,transparent 60%),
             radial-gradient(900px 700px at 100% 100%,#4a2c5e 0%,transparent 55%),
             linear-gradient(170deg,var(--bg1),var(--bg2));
  background-attachment:fixed;overflow-x:hidden;min-height:100vh;
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.screen{position:relative;z-index:1;min-height:100vh;display:none;align-items:center;justify-content:center;padding:32px 16px}
.screen.active{display:flex;animation:fade .7s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{
  width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);
  border-radius:24px;padding:36px 28px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center
}
.wide{max-width:760px}
h1,h2{font-family:'Caveat',cursive;font-weight:700;line-height:1.1}
h1{font-size:clamp(42px,9vw,64px)}
h2{font-size:clamp(34px,7vw,48px);margin-bottom:12px}
p{line-height:1.6;color:var(--muted)}
.emoji{font-size:64px;display:inline-block;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
.btn{
  margin-top:24px;border:0;cursor:pointer;font:800 17px 'Nunito',sans-serif;color:#1a1530;
  padding:14px 30px;border-radius:999px;background:linear-gradient(90deg,var(--accent),#ffd88a);
  box-shadow:0 8px 24px rgba(255,184,77,.3);transition:transform .15s
}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.progress{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
.progress span{width:34px;height:6px;border-radius:6px;background:var(--line);transition:background .4s}
.progress span.done{background:var(--accent)}
.q-num{font-size:14px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent2);font-weight:800}
.q-text{font-size:22px;font-weight:800;color:var(--text);margin:10px 0 6px}
.q-hint{font-size:14px;min-height:22px}
input[type=text]{
  width:100%;margin-top:18px;padding:15px 18px;border-radius:14px;border:1px solid var(--line);
  background:rgba(0,0,0,.25);color:var(--text);font:600 18px 'Nunito',sans-serif;outline:none;text-align:center
}
input[type=text]:focus{border-color:var(--accent)}
.msg{margin-top:14px;min-height:24px;font-weight:700}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.letter{
  text-align:left;font-family:'Caveat',cursive;font-size:clamp(23px,4.8vw,30px);line-height:1.45;color:var(--text);
  white-space:pre-wrap;min-height:320px
}
.cursor{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-3px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.after{opacity:0;transition:opacity 1.5s;pointer-events:none}
.after.show{opacity:1;pointer-events:auto}
.ps{margin-top:22px;font-family:'Caveat',cursive;font-size:24px;color:var(--accent)}
.footer-note{margin-top:14px;font-size:14px}
@media (max-width:480px){.card{padding:28px 18px}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<section class="screen active" id="s-intro">
  <div class="card">
    <div class="emoji">🔐</div>
    <h1 id="introTitle">Привет!</h1>
    <p>Тут кое-что лежит только для тебя.<br>Но сначала докажи, что ты — это ты 😏<br>Ответь на вопросы, которые знаем только мы.</p>
    <button class="btn" onclick="startQuiz()">Погнали</button>
  </div>
</section>

<section class="screen" id="s-quiz">
  <div class="card">
    <div class="progress" id="progress"></div>
    <div class="q-num" id="qNum"></div>
    <div class="q-text" id="qText"></div>
    <p class="q-hint" id="qHint"></p>
    <form onsubmit="checkAnswer(event)">
      <input type="text" id="qInput" autocomplete="off" placeholder="Твой ответ...">
      <button class="btn" type="submit">Ответить</button>
    </form>
    <div class="msg" id="qMsg"></div>
  </div>
</section>

<section class="screen" id="s-letter">
  <div class="card wide">
    <div class="emoji">✨</div>
    <div class="letter" id="letter"></div>
    <div class="after" id="after">
      <p class="ps" id="ps"></p>
      <p class="footer-note">Сделай скриншот и пришли мне 📸</p>
      <button class="btn ghost" onclick="location.reload()">Пройти заново</button>
    </div>
  </div>
</section>

<script>
/* =====================================================================
   ВСЁ, ЧТО МОЖНО ПОМЕНЯТЬ — ЗДЕСЬ.
   ===================================================================== */
const CONFIG = {
  name: "Настя",

  // answers — все допустимые варианты (регистр, ё/е и знаки не важны)
  questions: [
    { q: "Когда мой день рождения? (ДД.ММ)",
      hint: "Подсказка: я долгожитель 957 года рождения 😄",
      answers: ["04.07", "4.07", "04.7", "4.7", "0407", "4 июля", "четвертое июля", "04.07.957"] },
    { q: "Наша любимая и одновременно нелюбимая игра?",
      hint: "Подсказка: Москва, Кутузовский...",
      answers: ["rmrp", "рмрп", "rmrp москва", "рмрп москва", "москва", "кутузовский"] },
    { q: "Когда началось наше полноценное общение? (ДД.ММ)",
      hint: "Подсказка: ночь, ПАБГ, 1 на 1",
      answers: ["02.11", "2.11", "02.11.2026", "2.11.2026", "0211", "2 ноября", "второе ноября"] },
    { q: "Кого не хватало 09.11.2026 вечером?",
      hint: "Подсказка: он сейчас ждёт, когда ты ответишь 🙂",
      answers: ["меня", "тебя", "ты", "его", "мне тебя", "тебя не хватало", "меня не хватало"] },
    { q: "Вечер, когда мы говорили до слёз? (ДД.ММ)",
      hint: "Подсказка: на следующий день после прошлого вопроса",
      answers: ["10.11", "10.11.2026", "1011", "10 ноября", "десятое ноября"] },
  ],

  letter:
`{name},

спасибо тебе, что ты появилась в моей жизни.

Я и подумать не мог, что всё сложится именно так. Что однажды, совсем неожиданно, появится человек, с которым можно и поплакать, и смеяться до боли в животе, и гулять до самого утра — и ни капли не устать.

Человек, который, почти меня не зная, будет переживать за каждый мой шаг.

Я правда это ценю. Больше, чем умею сказать словами.

Спасибо тебе, что ты есть.`,

  // лёгкий намёк — появляется после письма
  ps: "P.S. Иногда мне кажется, что слово «друг» для тебя слишком маленькое 🙂",
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/[,\/\-]/g,'.').replace(/[^\p{L}\p{N}.]+/gu,' ').trim().replace(/\s+/g,' ').replace(/\.+$/,'');
let qi = 0;

$('introTitle').textContent = `Привет, ${CONFIG.name}!`;
$('ps').textContent = CONFIG.ps;

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active'); window.scrollTo(0,0);
  if(id==='s-letter') typeLetter();
}

function startQuiz(){
  $('progress').innerHTML = CONFIG.questions.map(()=>'<span></span>').join('');
  showQ(); go('s-quiz'); setTimeout(()=>$('qInput').focus(),300);
}
let tries = 0;
function showQ(){
  const q = CONFIG.questions[qi]; tries = 0;
  $('qNum').textContent = `Вопрос ${qi+1} из ${CONFIG.questions.length}`;
  $('qText').textContent = q.q; $('qHint').textContent = '';
  $('qInput').value=''; $('qMsg').textContent=''; $('qMsg').className='msg';
  [...$('progress').children].forEach((s,i)=>s.classList.toggle('done', i<qi));
}
const wrong = ["Не-а 🙈","Попробуй ещё раз 😏","Почти... но нет","Ты точно Настя? 🤨"];
function checkAnswer(e){
  e.preventDefault();
  const q = CONFIG.questions[qi], v = norm($('qInput').value);
  if(!v) return;
  if(q.answers.some(a=>norm(a)===v)){
    $('qMsg').textContent = 'Верно!'; $('qMsg').className='msg ok'; burst(25);
    setTimeout(()=>{ qi++; if(qi<CONFIG.questions.length){ showQ(); $('qInput').focus(); } else { burst(90); go('s-letter'); } }, 800);
  } else {
    tries++;
    $('qMsg').textContent = wrong[(tries-1)%wrong.length]; $('qMsg').className='msg bad';
    if(tries>=2 && q.hint) $('qHint').textContent = q.hint;
    const c=$('s-quiz').querySelector('.card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
  }
}

let typed=false;
function typeLetter(){
  if(typed) return; typed=true;
  const text = CONFIG.letter.replace('{name}', CONFIG.name), el=$('letter'); let i=0, done=false;
  el.innerHTML='<span id="lt"></span><span class="cursor"></span>';
  const t=$('lt');
  const finish=()=>{ if(done) return; done=true; setTimeout(()=>{ $('after').classList.add('show'); burst(60); },1200); };
  (function step(){
    if(i<text.length){ t.textContent += text[i++]; setTimeout(step, '.,—'.includes(text[i-1])?180:34); }
    else finish();
  })();
  el.onclick=()=>{ i=text.length; t.textContent=text; };
}

// Звёздное небо + салют из искр
const cv=$('sky'), ctx=cv.getContext('2d'); let W,H, stars=[], sparks=[];
function rs(){ W=cv.width=innerWidth; H=cv.height=innerHeight; } rs(); addEventListener('resize',rs);
for(let i=0;i<120;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6.28});
const cols=['#ffb84d','#ffd88a','#7c8cff','#b9c2ff','#ffffff'];
function burst(n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, sp=2+Math.random()*6;
  sparks.push({x:W/2,y:H/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,r:1.5+Math.random()*2,c:cols[i%cols.length],life:100+Math.random()*40}); } }
let shoot=null;
(function loop(t){
  ctx.clearRect(0,0,W,H);
  for(const s of stars){ ctx.globalAlpha=.35+.35*Math.sin(s.p+t/900); ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,6.28); ctx.fill(); }
  if(!shoot && Math.random()<.004) shoot={x:Math.random()*W*.7,y:Math.random()*H*.3,l:0};
  if(shoot){ shoot.l+=12; const g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x+shoot.l,shoot.y+shoot.l*.4);
    g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(255,255,255,.8)');
    ctx.globalAlpha=1; ctx.strokeStyle=g; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.moveTo(shoot.x+shoot.l*.6,shoot.y+shoot.l*.24); ctx.lineTo(shoot.x+shoot.l,shoot.y+shoot.l*.4); ctx.stroke();
    if(shoot.l>260) shoot=null; }
  sparks=sparks.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.1; p.vx*=.99; p.life--;
    ctx.globalAlpha=Math.max(0,p.life/120); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill();
    return p.life>0; });
  ctx.globalAlpha=1; requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
